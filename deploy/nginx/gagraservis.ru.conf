# gagraservis.ru — taxi, excursiones, hoteles y restaurantes en Gagra (estático)
# -> /etc/nginx/sites-available/gagraservis.ru.conf

server {
    listen 80;
    listen [::]:80;
    server_name gagraservis.ru www.gagraservis.ru;

    # Certbot deja aquí el desafío ACME al renovar.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://gagraservis.ru$request_uri; }
}

# www -> sin www, para no partir el SEO entre dos dominios.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gagraservis.ru;

    ssl_certificate     /etc/letsencrypt/live/gagraservis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gagraservis.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gagraservis.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gagraservis.ru;

    root /var/www/gagraservis;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/gagraservis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gagraservis.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/seguridad.conf;

    # Sirve /ruta/ como /ruta/index.html, que es como se publicó el sitio.
    location / {
        include snippets/seguridad.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Si el sitio no trae su propio 404.html, borra esta línea: nginx daría
    # 500 al no encontrar la página de error.
    error_page 404 /404.html;

    include snippets/estatico.conf;

    access_log /var/log/nginx/gagraservis.access.log;
    error_log  /var/log/nginx/gagraservis.error.log;
}
