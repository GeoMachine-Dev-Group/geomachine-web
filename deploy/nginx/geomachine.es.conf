# geomachine.es — catálogo de servicios (Astro estático)
# -> /etc/nginx/sites-available/geomachine.es.conf

server {
    listen 80;
    listen [::]:80;
    server_name geomachine.es www.geomachine.es;

    # Certbot deja aquí el desafío ACME al renovar.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://geomachine.es$request_uri; }
}

# www -> sin www, para no partir el SEO entre dos dominios.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.geomachine.es;

    ssl_certificate     /etc/letsencrypt/live/geomachine.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geomachine.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://geomachine.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geomachine.es;

    root /var/www/geomachine;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/geomachine.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geomachine.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/seguridad.conf;

    # La raíz lleva al catálogo en español. Astro genera un dist/index.html con
    # meta-refresh como respaldo, pero un 301 real es más rápido y mejor para
    # SEO, así que se resuelve aquí antes de tocar disco.
    location = / { return 301 /es/servicios/; }

    # Astro construye en formato directorio: /es/servicios/index.html
    location / {
        include snippets/seguridad.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # 404.astro es un fichero estático; sin esto nginx serviría su 404 genérico
    # en vez del nuestro, que lleva noindex.
    error_page 404 /404.html;

    include snippets/estatico.conf;

    access_log /var/log/nginx/geomachine.access.log;
    error_log  /var/log/nginx/geomachine.error.log;
}
