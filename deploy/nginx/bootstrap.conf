# Configuración TEMPORAL, solo para obtener los primeros certificados.
#
# Los ficheros definitivos referencian /etc/letsencrypt/live/<dominio>/, que no
# existe hasta que certbot corre por primera vez: si los activas antes,
# `nginx -t` falla y nginx no arranca. Este fichero sirve el desafío ACME por
# HTTP y nada más. Se borra en cuanto los certificados existen.
#
# -> /etc/nginx/sites-available/bootstrap.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geomachine.es www.geomachine.es gagraservis.ru www.gagraservis.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
