# Caché y compresión, iguales en ambos sitios.

# Ficheros con hash en el nombre: nunca cambian de contenido, se cachean un año.
location /_astro/ {
    include snippets/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /fonts/ {
    include snippets/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# El HTML cambia en cada despliegue: revalidar siempre.
location ~* \.html$ {
    include snippets/seguridad.conf;
    add_header Cache-Control "no-cache" always;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
# text/html se comprime siempre, no hace falta listarlo. Los .woff2 ya vienen
# comprimidos: recomprimirlos gasta CPU y no baja ni un byte.
gzip_types text/css text/javascript application/javascript application/xml
           application/rss+xml image/svg+xml application/json;
