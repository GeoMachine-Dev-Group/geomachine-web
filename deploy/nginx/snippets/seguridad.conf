# Cabeceras comunes a los dos sitios.
#
# OJO con nginx: un `add_header` dentro de un `location` DESCARTA todos los
# heredados del `server`. Por eso esto es un snippet y no una lista suelta a
# nivel de server: hay que incluirlo también dentro de cada `location` que
# añada cabeceras propias, o esas rutas se quedan sin protección.
add_header X-Content-Type-Options   "nosniff"                        always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header X-Frame-Options          "SAMEORIGIN"                      always;
